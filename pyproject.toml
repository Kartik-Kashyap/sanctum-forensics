[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sanctum-forensics"
version = "1.0.0"
description = "Integrated Secure Data Erasure & Forensic Recovery Platform"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Team Sanchay", email = "team-sanchay@example.invalid" }]
keywords = ["digital forensics", "data sanitization", "file carving", "NIST SP 800-88", "DFIR"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Legal Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Filesystems",
]

# The engines have no third-party requirements. Everything else is an extra, so
# that `pip install sanctum-forensics` yields a working tool on any machine.
dependencies = []

[project.optional-dependencies]
gui = ["PyQt6>=6.6"]
native = ["pytsk3>=20230125", "pyewf>=20171104"]
dev = ["pytest>=7.4"]

[project.scripts]
sanctum = "sanctum.gui.app:run"

[project.urls]
Documentation = "https://example.invalid/sanctum/docs"

[tool.setuptools]
packages = [
    "sanctum",
    "sanctum.core",
    "sanctum.erase",
    "sanctum.recover",
    "sanctum.report",
    "sanctum.gui",
    "sanctum.gui.views",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error::DeprecationWarning:sanctum.*"]
